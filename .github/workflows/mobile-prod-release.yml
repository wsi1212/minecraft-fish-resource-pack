name: Mobile production resource pack

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "assets/**"
      - "pack.mcmeta"
      - "pack.png"
      - "tools/**"
  workflow_dispatch:
    inputs:
      promote:
        description: "Publish only when manually running this workflow from main"
        required: true
        type: boolean
        default: false

concurrency:
  group: mobile-prod-resource-pack
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resource pack
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image builder dependency
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Build production pack
        env:
          RP_ROOT: ${{ github.workspace }}
          OUT: /tmp/barkan-resourcepack-slim.zip
        run: python tools/build-prod-rp.py

      - name: Validate production pack
        run: |
          unzip -t /tmp/barkan-resourcepack-slim.zip >/dev/null
          python - <<'PY'
          import json
          import zipfile

          path = "/tmp/barkan-resourcepack-slim.zip"
          with zipfile.ZipFile(path) as z:
              names = set(z.namelist())
              assert "pack.mcmeta" in names
              assert "assets/barkan/font/gui.json" in names
              assert "assets/barkan/sounds.json" in names
              assert any(n.startswith("assets/barkan/") for n in names)
              mc = json.loads(z.read("pack.mcmeta"))["pack"]
              assert "min_format" in mc and "max_format" in mc
              gui = json.loads(z.read("assets/barkan/font/gui.json"))["providers"]
              assert len(gui) > 200, len(gui)
              assert not any(".codex-backup" in n or ".bak" in n for n in names)
          print("resource pack validation passed")
          PY

      - name: Upload validated pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-resource-pack
          path: /tmp/barkan-resourcepack-slim.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.promote)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated pack
        uses: actions/download-artifact@v4
        with:
          name: mobile-resource-pack
          path: dist

      - name: Publish production candidate Release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          TAG="mobile-rp-${GITHUB_RUN_NUMBER}-$(date -u +%Y%m%d-%H%M%S)"
          cp dist/barkan-resourcepack-slim.zip dist/barkan-resourcepack.zip
          # ★APPLY_NOW 는 넣지 않는다 (2026-09-02 폐지). prod 의 fetch-resourcepack.sh 는
          #   server.properties 의 URL/SHA1 만 갱신하고 재시작하지 않는다 — 새 팩은
          #   06:00 KST 정기 재시작 이후 접속자에게 내려간다. 즉시 확인은 dev 에서 한다.
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "refs/heads/main" ]]; then
            NOTES="MOBILE_RP_PROMOTE\nAuto-promoted from main by mobile-prod-release.yml."
          else
            NOTES="MOBILE_RP_PROMOTE\nBuilt and validated by manual mobile-prod-release.yml."
          fi
          printf '%b\n' "$NOTES" > dist/release-notes.txt
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mobile resource pack $TAG" \
            --notes-file dist/release-notes.txt \
            dist/barkan-resourcepack.zip
          echo "Published $TAG"
